<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Horned helmet -->
  <rect x="3" y="0" width="1" height="2" fill="#aaa"/>
  <rect x="12" y="0" width="1" height="2" fill="#aaa"/>
  <rect x="4" y="1" width="1" height="1" fill="#aaa"/>
  <rect x="11" y="1" width="1" height="1" fill="#aaa"/>
  <rect x="5" y="1" width="6" height="2" fill="#888"/>
  <rect x="4" y="2" width="8" height="1" fill="#888"/>
  <rect x="5" y="3" width="6" height="1" fill="#777"/>
  <!-- Face -->
  <rect x="4" y="4" width="8" height="5" fill="#7bc96f"/>
  <rect x="3" y="5" width="1" height="3" fill="#7bc96f"/>
  <rect x="12" y="5" width="1" height="3" fill="#7bc96f"/>
  <!-- Eyes (angry) -->
  <rect x="5" y="5" width="1" height="1" fill="#2d2d44"/>
  <rect x="6" y="6" width="1" height="1" fill="#fff"/>
  <rect x="5" y="6" width="1" height="1" fill="#fff"/>
  <rect x="6" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#fff"/>
  <rect x="10" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="10" y="5" width="1" height="1" fill="#2d2d44"/>
  <!-- Mouth (toothy grin) -->
  <rect x="6" y="8" width="4" height="1" fill="#2d2d44"/>
  <rect x="7" y="8" width="1" height="1" fill="#fff"/>
  <rect x="9" y="8" width="1" height="1" fill="#fff"/>
  <!-- Axe (right side) -->
  <rect x="13" y="2" width="1" height="6" fill="#8B4513"/>
  <rect x="14" y="3" width="2" height="3" fill="#aaa"/>
  <rect x="14" y="2" width="1" height="1" fill="#aaa"/>
  <rect x="14" y="6" width="1" height="1" fill="#aaa"/>
  <!-- Body (armor) -->
  <rect x="4" y="9" width="8" height="2" fill="#555"/>
  <rect x="3" y="10" width="1" height="2" fill="#555"/>
  <rect x="12" y="10" width="1" height="2" fill="#555"/>
  <!-- Belt -->
  <rect x="4" y="11" width="8" height="1" fill="#8B4513"/>
  <rect x="7" y="11" width="2" height="1" fill="#ffd43b"/>
  <!-- Legs -->
  <rect x="4" y="12" width="3" height="3" fill="#555"/>
  <rect x="9" y="12" width="3" height="3" fill="#555"/>
  <!-- Feet -->
  <rect x="4" y="15" width="3" height="1" fill="#444"/>
  <rect x="9" y="15" width="3" height="1" fill="#444"/>
</svg>

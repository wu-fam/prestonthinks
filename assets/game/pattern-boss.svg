<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Antenna -->
  <rect x="7" y="0" width="2" height="1" fill="#4dabf7"/>
  <rect x="7" y="0" width="1" height="1" fill="#ffd43b"/>
  <rect x="8" y="0" width="1" height="1" fill="#ffd43b"/>
  <rect x="7" y="1" width="2" height="1" fill="#888"/>
  <!-- Head (boxy, robotic) -->
  <rect x="4" y="2" width="8" height="6" fill="#4dabf7"/>
  <rect x="3" y="3" width="1" height="4" fill="#4dabf7"/>
  <rect x="12" y="3" width="1" height="4" fill="#4dabf7"/>
  <!-- Screen face -->
  <rect x="5" y="3" width="6" height="4" fill="#1a1a2e"/>
  <!-- Eyes (digital, rectangular) -->
  <rect x="6" y="4" width="1" height="2" fill="#51cf66"/>
  <rect x="9" y="4" width="1" height="2" fill="#51cf66"/>
  <!-- Digital mouth (LED dots) -->
  <rect x="6" y="6" width="1" height="1" fill="#51cf66"/>
  <rect x="7" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="8" y="6" width="1" height="1" fill="#51cf66"/>
  <rect x="9" y="6" width="1" height="1" fill="#1a1a2e"/>
  <rect x="10" y="6" width="1" height="1" fill="#51cf66"/>
  <!-- Ear bolts -->
  <rect x="3" y="4" width="1" height="2" fill="#ffd43b"/>
  <rect x="12" y="4" width="1" height="2" fill="#ffd43b"/>
  <!-- Neck -->
  <rect x="6" y="8" width="4" height="1" fill="#888"/>
  <!-- Body (calculator style) -->
  <rect x="4" y="9" width="8" height="4" fill="#3d5c8a"/>
  <rect x="3" y="10" width="1" height="2" fill="#3d5c8a"/>
  <rect x="12" y="10" width="1" height="2" fill="#3d5c8a"/>
  <!-- Number pad on chest -->
  <rect x="5" y="10" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="10" width="2" height="1" fill="#1a1a2e"/>
  <rect x="5" y="12" width="2" height="1" fill="#1a1a2e"/>
  <rect x="9" y="12" width="2" height="1" fill="#1a1a2e"/>
  <!-- Legs -->
  <rect x="5" y="13" width="2" height="2" fill="#888"/>
  <rect x="9" y="13" width="2" height="2" fill="#888"/>
  <!-- Feet -->
  <rect x="4" y="15" width="3" height="1" fill="#666"/>
  <rect x="9" y="15" width="3" height="1" fill="#666"/>
</svg>

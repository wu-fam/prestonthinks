<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Wizard hat -->
  <rect x="7" y="0" width="2" height="1" fill="#7048e8"/>
  <rect x="6" y="1" width="4" height="1" fill="#7048e8"/>
  <rect x="5" y="2" width="6" height="1" fill="#7048e8"/>
  <!-- Star on hat -->
  <rect x="7" y="1" width="2" height="1" fill="#ffd43b"/>
  <!-- Hat brim -->
  <rect x="3" y="3" width="10" height="1" fill="#5f3dc4"/>
  <!-- Head (snake, diamond) -->
  <rect x="5" y="4" width="6" height="4" fill="#51cf66"/>
  <rect x="4" y="5" width="1" height="2" fill="#51cf66"/>
  <rect x="11" y="5" width="1" height="2" fill="#51cf66"/>
  <!-- Scales pattern -->
  <rect x="6" y="5" width="1" height="1" fill="#40a85c"/>
  <rect x="8" y="5" width="1" height="1" fill="#40a85c"/>
  <rect x="10" y="5" width="1" height="1" fill="#40a85c"/>
  <!-- Eyes (hypnotic) -->
  <rect x="5" y="5" width="2" height="2" fill="#ffd43b"/>
  <rect x="9" y="5" width="2" height="2" fill="#ffd43b"/>
  <rect x="6" y="5" width="1" height="1" fill="#7048e8"/>
  <rect x="10" y="5" width="1" height="1" fill="#7048e8"/>
  <rect x="5" y="6" width="1" height="1" fill="#7048e8"/>
  <rect x="9" y="6" width="1" height="1" fill="#7048e8"/>
  <!-- Tongue -->
  <rect x="7" y="8" width="2" height="1" fill="#c92a2a"/>
  <rect x="6" y="9" width="1" height="1" fill="#c92a2a"/>
  <rect x="9" y="9" width="1" height="1" fill="#c92a2a"/>
  <!-- Body coils -->
  <rect x="4" y="9" width="8" height="2" fill="#51cf66"/>
  <rect x="3" y="10" width="1" height="2" fill="#51cf66"/>
  <rect x="12" y="10" width="1" height="2" fill="#51cf66"/>
  <rect x="5" y="10" width="2" height="1" fill="#40a85c"/>
  <rect x="9" y="10" width="2" height="1" fill="#40a85c"/>
  <rect x="4" y="11" width="8" height="2" fill="#40a85c"/>
  <rect x="5" y="12" width="2" height="1" fill="#51cf66"/>
  <rect x="9" y="12" width="2" height="1" fill="#51cf66"/>
  <rect x="4" y="13" width="8" height="2" fill="#51cf66"/>
  <rect x="6" y="14" width="2" height="1" fill="#40a85c"/>
  <!-- Tail tip -->
  <rect x="5" y="15" width="2" height="1" fill="#51cf66"/>
  <rect x="9" y="15" width="2" height="1" fill="#51cf66"/>
</svg>
